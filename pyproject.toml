[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# E — длина строк и базовый стиль, F — неиспользуемое,
# I — порядок импортов, UP — идиомы py311, B/C4 — вероятные баги,
# S/BLE — осознанные except обрабатываются точечными noqa.
select = ["E", "F", "I", "UP", "B", "C4", "S", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert в тестах — идиома pytest
"tests/test_telegram.py" = ["S101", "E501"]  # TG_HTML — фикстура-данные, переносы меняют её
"tools/i18n_en/*" = ["E501"]  # таблицы переводов: ключ — фраза целиком, одна запись на строку
