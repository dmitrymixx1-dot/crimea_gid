name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app tests
      - name: JS syntax check
        run: |
          node --check static/app.js
          node --check static/plan-link.js
          node --check static/catalog-link.js
          node --check static/catalog-page.js
          node --check static/open-now.js
          node --check static/sw.js
      - name: JS unit tests
        run: node --test "tests/js/*.test.js"
      - name: Test suite
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t crimea-gid:ci .
      - name: Validate compose stack
        # Конфиг обязан собираться с заполненным .env и падать без него.
        run: |
          cp .env.example .env
          docker compose config --quiet
          rm .env
          if docker compose config --quiet 2>/dev/null; then
            echo "compose должен требовать DOMAIN/ACME_EMAIL" >&2
            exit 1
          fi
