# Автодеплой по тегу: сначала проверяем релиз тестами и репетицией выката,
# потом катим его по SSH. Никаких сторонних экшенов и секретов в репозитории:
# ключ, хост и путь до клона лежат в секретах GitHub.
#
# Секреты (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST        — адрес сервера
#   DEPLOY_USER        — пользователь с docker и доступом к каталогу клона
#   DEPLOY_PATH        — каталог с клоном репозитория (напр. /opt/crimea_gid)
#   DEPLOY_SSH_KEY     — приватный ключ ed25519 (публичный — на сервере)
#   DEPLOY_PORT        — порт SSH (необязательно, по умолчанию 22)
#   DEPLOY_KNOWN_HOSTS — вывод `ssh-keyscan -H <host>` (необязательно, но желателен)
#
# Репетиция (dry_run=true при ручном запуске) проходит весь путь до SSH:
# тесты релиза, проверка секретов и `deploy.sh --dry-run`. Она нужна, чтобы
# сценарий выката можно было проверить до того, как появились сервер и ключи.
name: Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Тег или коммит для выката"
        required: true
        default: main
      dry_run:
        description: "Репетиция: тесты и план выката, без SSH"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

# Два выката одновременно перепутали бы версии: пусть встают в очередь.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Тег мог быть навешен на коммит, который не прошёл CI
      # (например, пуш тега без пуша ветки) — проверяем перед выкатом.
      - name: Preflight (линтер и тесты релиза)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          ruff check app tests
          ruff format --check app tests tools
          python -m pytest -q
          node --test "tests/js/*.test.js"
          python tools/i18n_en/build.py --check

      # Репетиция выката: те же проверки, что делает сервер (ref существует,
      # состав репозитория цел, скрипты валидны, версия в коде совпадает
      # с тегом), только без Docker и без SSH.
      - name: Репетиция выката
        env:
          REF: ${{ github.event.inputs.ref || github.ref_name }}
        run: |
          case "$REF" in
            v*) expect="${REF#v}" ;;
            *) expect="" ;;
          esac
          DRY_RUN=1 APP_DIR="$PWD" EXPECT_VERSION="$expect" ./deploy/deploy.sh HEAD

      - name: Проверить секреты деплоя
        env:
          DRY: ${{ github.event.inputs.dry_run || 'false' }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=""
          for var in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY; do
            [ -n "${!var:-}" ] || missing="$missing $var"
          done
          if [ -n "$missing" ]; then
            if [ "$DRY" = "true" ]; then
              echo "::warning::репетиция: не заданы секреты:$missing — настоящий выкат бы не прошёл"
              exit 0
            fi
            echo "::error::не заданы секреты:$missing — Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Настроить SSH
        if: ${{ (github.event.inputs.dry_run || 'false') != 'true' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "${DEPLOY_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_KNOWN_HOSTS не задан — доверяем ключу хоста из ssh-keyscan"
            ssh-keyscan -H "$DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Выкатить
        if: ${{ (github.event.inputs.dry_run || 'false') != 'true' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          REF: ${{ github.event.inputs.ref || github.ref_name }}
        run: |
          # Теги вида v1.9.0 → ожидаемая версия 1.9.0 (без «v»);
          # ветку версией не сверяем.
          case "$REF" in
            v*) expect="${REF#v}" ;;
            *) expect="" ;;
          esac
          ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -p "${DEPLOY_PORT:-22}" \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "cd '$DEPLOY_PATH' && EXPECT_VERSION='$expect' ./deploy/deploy.sh '$REF'"

      - name: Что получилось
        if: ${{ success() && (github.event.inputs.dry_run || 'false') != 'true' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -p "${DEPLOY_PORT:-22}" \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "cd '$DEPLOY_PATH' && docker compose ps && git describe --tags --always"

      - name: Итог репетиции
        if: ${{ always() && (github.event.inputs.dry_run || 'false') == 'true' }}
        run: |
          echo "::notice::Репетиция завершена: тесты релиза, проверка секретов и план выката прошли без SSH."
          echo "::notice::Для настоящего выката запустите workflow с dry_run=false (или пушьте тег v*)."
